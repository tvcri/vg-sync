name: Publish jotform-vg image
# Builds carlsmig/vg-sync-jotform (compose service `jotform`) when its
# inputs change. If jotform-vg.Dockerfile ever copies a new path, add it
# here; a missing entry means a real change silently doesn't deploy.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/jotform-vg/**'
      - 'jotform-vg.Dockerfile'
      - 'package.json'
      - '.github/workflows/publish-jotform-vg.yml'
      - '.github/workflows/publish-image.yml'
jobs:
  publish:
    uses: ./.github/workflows/publish-image.yml
    with:
      repository: carlsmig/vg-sync-jotform
      dockerfile: jotform-vg.Dockerfile
      description: Headless sync from JotForm Friendly Calls & Visits reports to Village Green
    secrets: inherit
